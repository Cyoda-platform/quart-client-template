openapi: 3.0.3
info:
  title: Cyoda Client Application API
  description: |
    Comprehensive API specification for the Cyoda Client Application.
    
    This API provides entity management capabilities with workflow-driven state management.
    All entities follow the Cyoda architecture patterns with proper validation, 
    error handling, and state transitions.
    
    ## Authentication
    All endpoints require Bearer token authentication.
    
    ## Entity Lifecycle
    Entities follow a workflow-driven lifecycle:
    - **Create**: Entities start in `initial_state` and automatically transition to `created`
    - **Update**: Manual transitions from `created` or `updated` states
    - **Cancel**: Manual transitions to `cancelled` state (terminal)
    
    ## Error Handling
    The API uses standard HTTP status codes and provides detailed error responses
    with validation information when applicable.
  version: 1.0.0
  contact:
    name: Cyoda Client Application
    url: https://cyoda.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.cyoda.io
    description: Production server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication

  schemas:
    # Common response schemas
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Validation failed for the provided data"
        details:
          type: object
          description: Additional error details
          additionalProperties: true

    ValidationErrorResponse:
      type: object
      required:
        - error
        - message
        - validation_errors
      properties:
        error:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Request validation failed"
        validation_errors:
          type: array
          description: List of validation errors
          items:
            type: object
            properties:
              field:
                type: string
                description: Field name that failed validation
              message:
                type: string
                description: Validation error message
              value:
                description: The invalid value provided

    NotFoundResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "Entity not found"

    # Common entity metadata
    EntityMeta:
      type: object
      description: Common entity metadata managed by Cyoda
      properties:
        state:
          type: string
          description: Current workflow state
          example: "created"
        version:
          type: integer
          description: Entity version for optimistic locking
          example: 1
        created_at:
          type: string
          format: date-time
          description: Entity creation timestamp
          example: "2023-12-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Entity last update timestamp
          example: "2023-12-01T10:30:00Z"

    # Pagination support
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number
          example: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          description: Items per page
          example: 20
        total:
          type: integer
          minimum: 0
          description: Total number of items
          example: 150
        total_pages:
          type: integer
          minimum: 0
          description: Total number of pages
          example: 8

  parameters:
    # Common path parameters
    EntityId:
      name: id
      in: path
      required: true
      description: Entity technical ID (UUID)
      schema:
        type: string
        format: uuid
        example: "123e4567-e89b-12d3-a456-426614174000"

    # Common query parameters
    Page:
      name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

  responses:
    # Common error responses
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "UNAUTHORIZED"
            message: "Authentication required"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "FORBIDDEN"
            message: "Insufficient permissions"

    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "INTERNAL_ERROR"
            message: "An unexpected error occurred"

tags:
  - name: Orders
    description: Order entity management operations
    externalDocs:
      description: Order functional requirements
      url: /docs/order-requirements

  - name: System
    description: System health and information endpoints

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns the health status of the application
      operationId: healthCheck
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2023-12-01T10:00:00Z"

# Include Order API specifications
$ref: './order_api.yaml#/paths'
